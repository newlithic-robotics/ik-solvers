[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newlithic-ik-solvers"
version = "0.2.0"
description = "Two SO-ARM101s with the Newlithic gripper: MuJoCo model, IK solvers, and the pipeline from UMI-style demonstrations to LeRobot datasets"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
# stage 0: the demonstration export and the wrist videos from the state-estimation pipeline's outputs
demo = [
    "newlithic-state-estimation @ git+https://github.com/newlithic-robotics/state-estimation.git@world-pose",
    "pandas>=2.0", "opencv-contrib-python>=4.8,<5", "imageio-ffmpeg>=0.5",
]
# stage 1: the arm model and the solvers (the `newlithic` package)
solve = ["mujoco>=3.4", "mink>=1.3", "qpsolvers>=4", "daqp", "osqp", "trimesh", "pyyaml", "pandas>=2.0", "imageio", "imageio-ffmpeg",
         "matplotlib", "pillow", "opencv-contrib-python>=4.8,<5"]
# stage 2: the LeRobot dataset writer (lerobot brings torch, pyarrow, av)
export = ["lerobot[dataset]>=0.4.4"]       # 0.6+ keeps datasets / pyarrow / av behind this extra
all = ["newlithic-ik-solvers[demo,solve,export]"]
test = ["pytest>=8"]

[project.scripts]
newlithic-lerobot = "newlithic_lerobot.cli:main"

[tool.setuptools]
packages = ["newlithic", "newlithic_lerobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
