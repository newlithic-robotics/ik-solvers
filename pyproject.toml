[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newlithic-lerobot"
version = "0.1.0"
description = "UMI-style demonstrations of two SO-ARM101s with the Newlithic gripper -> LeRobot (bi_so_follower) training datasets"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
# stage 2 (`export`): lerobot brings torch, pyarrow, av, opencv.  Pin to the format version this was written against.
export = ["lerobot>=0.4.4"]
test = ["pytest>=8"]

[project.scripts]
newlithic-lerobot = "newlithic_lerobot.cli:main"

[tool.setuptools]
packages = ["newlithic_lerobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
